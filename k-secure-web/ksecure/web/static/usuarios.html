<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Usuarios · K-Secure</title>
  <link rel="icon" href="/img/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Exo+2:wght@600;700&family=Inter:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="/css/ksecure.css">
</head>
<body data-pagina="usuarios">
  <header id="site-header" class="site-header"></header>

  <main class="container" style="max-width:1080px">
    <div class="section-title entrar">
      <div>
        <h1 style="margin:0">Usuarios</h1>
        <p class="muted" style="margin:6px 0 0">Las cuentas las crea un administrador: no hay registro público.</p>
      </div>
      <button class="btn btn-primary" id="nuevo" type="button"></button>
    </div>

    <div class="tabla-wrap entrar" style="margin-top:20px">
      <table class="tabla-usuarios">
        <thead><tr><th>Persona</th><th>Rol</th><th>Estado</th><th>Último ingreso</th><th><span class="sr-only">Acciones</span></th></tr></thead>
        <tbody id="lista"></tbody>
      </table>
    </div>

    <section class="section">
      <div class="section-title">
        <h2>Qué puede hacer cada rol</h2>
        <p class="muted" style="margin:0">Cada rol puede todo lo del anterior.</p>
      </div>
      <div class="grid grid-3" id="roles"></div>
    </section>

    <section class="section">
      <h2>Clave de auditor</h2>
      <div class="card clave-auditor" id="clave-auditor"></div>
    </section>

    <section class="section">
      <h2>Correo para recuperar contraseñas</h2>
      <div class="card envio-correo" id="envio-correo"></div>
    </section>
  </main>

  <footer id="site-footer" class="site-footer"></footer>
  <script type="module" src="/js/usuarios.js"></script>
</body>
</html>
