<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="icon" href="/img/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">

<body data-pagina="historial">

    <div class="section-title entrar">
      <div>
        <p class="muted" style="margin:0"><a href="/historial.html">Historial</a> › Comparar</p>
        <h1 style="margin:0">Comparar escaneos</h1>
      </div>
    </div>
    <p class="muted entrar">Qué datos sensibles aumentaron o disminuyeron entre dos escaneos de la misma fuente.

      <button class="btn btn-primary" type="submit">Comparar</button>
