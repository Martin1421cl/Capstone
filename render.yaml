# Despliegue en Render (plan gratis). En Render: New → Blueprint → elegir este repositorio.
services:
  - type: web
    name: k-secure
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn ksecure.web.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      # Base interna en Neon (PostgreSQL gratis). Render no guarda archivos entre reinicios.
      - key: KSECURE_DB_URL
        sync: false
      # Usuario y contraseña para entrar a la web, con la forma usuario:contraseña.
      - key: KSECURE_ACCESO
        sync: false
