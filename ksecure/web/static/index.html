<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>K-Secure</title>
<style>
  :root { --bg: #f6f7f9; --card: #fff; --text: #1d2330; --muted: #5b6475; --border: #dfe3ea; --accent: #1f5fbf;
          --restringido: #b42318; --confidencial: #b54708; --interno: #1f5fbf; --publico: #3b7a3b; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); }
  main { max-width: 1100px; margin: 0 auto; padding: 24px 16px; }
  h1 { margin: 0 0 4px; } .sub { color: var(--muted); margin: 0 0 20px; }
  form { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 16px;
         display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
  button { background: var(--accent); color: #fff; border: 0; border-radius: 6px; padding: 8px 18px; font-size: 15px; cursor: pointer; }
  button:disabled { opacity: .6; cursor: wait; }
  .file { background: var(--card); border: 1px solid var(--border); border-radius: 8px; margin-top: 16px; padding: 16px; }
  .file h2 { font-size: 17px; margin: 0 0 8px; word-break: break-all; }
  .error { color: var(--restringido); }
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  th { color: var(--muted); font-weight: 600; }
  td.dato { font-family: ui-monospace, monospace; }
  .badge { padding: 2px 8px; border-radius: 10px; color: #fff; font-size: 12px; }
  .Restringido { background: var(--restringido); } .Confidencial { background: var(--confidencial); }
  .Interno { background: var(--interno); } .Público { background: var(--publico); }
</style>
</head>
<body>
<main>
  <h1>K-Secure</h1>
  <p class="sub">Detección de datos sensibles chilenos: RUT, teléfonos, tarjetas, correos, cuentas bancarias, patentes y secretos.</p>
  <form id="form">
    <input type="file" id="files" name="files" multiple required aria-label="Archivos a escanear">
    <button type="submit" id="btn">Escanear</button>
    <span id="status" role="status"></span>
  </form>
  <div id="results"></div>
</main>
<script>
const form = document.getElementById("form"), btn = document.getElementById("btn"),
      status = document.getElementById("status"), out = document.getElementById("results");

function el(tag, attrs = {}, ...children) {
  const e = document.createElement(tag);
  Object.assign(e, attrs);
  e.append(...children);  // textContent, nunca innerHTML: los datos vienen de archivos del usuario
  return e;
}

function renderFile(r) {
  const box = el("section", {className: "file"}, el("h2", {}, r.filename));
  if (!r.success) return box.append(el("p", {className: "error"}, "No se pudo leer: " + r.error)), box;
  box.append(el("p", {}, `${r.matches.length} hallazgos · ${r.processor_type}`));
  if (!r.matches.length) return box;
  const rows = r.matches.map(m => el("tr", {},
    el("td", {}, String(m.line_number)), el("td", {}, m.type), el("td", {className: "dato"}, m.text),
    el("td", {}, `${m.confidence_level} (${Math.round(m.confidence)})`),
    el("td", {}, el("span", {className: "badge " + m.risk_level}, m.risk_level)),
    el("td", {}, m.positive_keywords.join(", "))));
  const head = el("tr", {}, ...["Línea", "Tipo", "Dato", "Confianza", "Riesgo", "Contexto"].map(h => el("th", {}, h)));
  box.append(el("div", {className: "table-wrap"}, el("table", {}, el("thead", {}, head), el("tbody", {}, ...rows))));
  return box;
}

form.addEventListener("submit", async e => {
  e.preventDefault();
  btn.disabled = true; status.textContent = "Escaneando…"; out.replaceChildren();
  try {
    const res = await fetch("/scan", {method: "POST", body: new FormData(form)});
    if (!res.ok) throw new Error((await res.json()).detail || res.statusText);
    const data = await res.json();
    status.textContent = `Total: ${data.total_matches} hallazgos`;
    out.append(...data.results.map(renderFile));
  } catch (err) {
    status.textContent = "Error: " + err.message;
  } finally {
    btn.disabled = false;
  }
});
</script>
</body>
</html>
